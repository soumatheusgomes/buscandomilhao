name: Shorts automatics

on:
  schedule:
    - cron: "0 11 * * *"
    - cron: "0 22 * * *"
  workflow_dispatch:
    inputs:
      slot:
        description: Horario do slot
        required: false
        default: "07:00"

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[video,test]"
      - name: Determine slot
        id: slot
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.slot }}" >> "$GITHUB_OUTPUT"
          elif [ "$(date -u +%H)" = "11" ]; then
            echo "value=07:00" >> "$GITHUB_OUTPUT"
          else
            echo "value=18:00" >> "$GITHUB_OUTPUT"
          fi
      - name: Generate review package
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_AUTO_PUBLISH: ${{ vars.YOUTUBE_AUTO_PUBLISH }}
        run: python main.py --slot "${{ steps.slot.outputs.value }}"
      - name: Upload review artifacts
        uses: actions/upload-artifact@v4
        with:
          name: shorts-${{ steps.slot.outputs.value }}
          path: output/
          if-no-files-found: warn
